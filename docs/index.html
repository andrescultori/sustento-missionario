<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sustento Missionário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout (igual ao mockup): menu lateral verde + conteúdo em cartões; no celular o menu vira uma faixa no topo */
:root{
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#14201C; --mute:#5B6B65; --line:#DDE5E1;
  --pri:#0F5C4D; --pri-ink:#FFFFFF; --pri-soft:#A9CFC5; --warn:#8A5A0B; --warn-bg:#FDF3DC; --warn-line:#F0DDB0;
  --side:#0F5C4D; --side-ink:#FFFFFF; --side-mute:#CFE5DE; --side-hl:rgba(255,255,255,0.16);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --card:#16211D; --ink:#E8F0EC; --mute:#9DB0A8; --line:#263530;
    --pri:#4FB89F; --pri-ink:#07261F; --pri-soft:#2C5A4E; --warn:#E2B259; --warn-bg:#2B2412; --warn-line:#4A3D1A;
    --side:#0B3F35; --side-ink:#FFFFFF; --side-mute:#B7D6CC; --side-hl:rgba(255,255,255,0.14); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --card:#16211D; --ink:#E8F0EC; --mute:#9DB0A8; --line:#263530;
  --pri:#4FB89F; --pri-ink:#07261F; --pri-soft:#2C5A4E; --warn:#E2B259; --warn-bg:#2B2412; --warn-line:#4A3D1A;
  --side:#0B3F35; --side-ink:#FFFFFF; --side-mute:#B7D6CC; --side-hl:rgba(255,255,255,0.14); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
/* Faixa fixa só cobre a área do recorte/barra de status; o espaço dessa área é somado UMA vez, no padding-top do menu */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
.app{display:flex;flex-wrap:wrap;align-content:flex-start;min-height:100vh;max-width:100%}
aside.side{flex:0 0 248px;align-self:stretch;min-width:0;max-width:100%;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:28px;padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.bar{display:flex;align-items:center;gap:8px}
.drawer{flex:1 1 auto;display:flex;flex-direction:column;gap:28px;min-width:0}
.brand{padding:0 12px;flex:1 1 auto;min-width:0}
.quick,.burger{display:none}
.brand b{display:block;font-size:22px;font-weight:700}
.brand span{font-size:13px;color:var(--side-mute)}
nav.menu{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
nav.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--side-mute);font:inherit;padding:10px 12px;border-radius:8px;cursor:pointer}
nav.menu button[aria-current="page"],.quick[aria-current="page"]{background:var(--side-hl);color:var(--side-ink);font-weight:600}
.count{display:inline-block;min-width:20px;margin-left:8px;padding:0 6px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:12px;text-align:center;font-weight:600}
.userbox{margin-top:auto;padding:0 12px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--side-mute)}
.userbox b{color:var(--side-ink);font-size:15px}
.tag{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--warn-bg);color:var(--warn)}
.seg{display:inline-flex;align-self:flex-start;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--side-mute);font:inherit;font-size:13px;font-weight:600;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--side-ink);color:var(--side)}
main{flex:999 1 min(100%,560px);min-width:0;display:flex;flex-direction:column;gap:24px;padding-top:32px;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:808px){main{padding-top:calc(32px + env(safe-area-inset-top,0px))}}
@media (min-width:900px){main{padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))}}
@media (max-width:807px){
  aside.side{flex-basis:100%;gap:0;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{padding:0 4px}
  .brand b{font-size:20px}
  .quick{display:block;border:0;background:transparent;color:var(--side-mute);font:inherit;padding:10px 12px;min-height:44px;border-radius:8px;cursor:pointer}
  .burger{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:1px solid rgba(255,255,255,.35);border-radius:8px;background:transparent;color:var(--side-ink);cursor:pointer}
  .burger svg{width:22px;height:22px}
  .burger .x{display:none}
  aside.side.open .burger .x{display:block}
  aside.side.open .burger .b{display:none}
  .drawer{display:none;gap:12px;padding-top:12px}
  aside.side.open .drawer{display:flex}
  nav.menu .m-home{display:none}
  .userbox{margin-top:0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-top:8px;border-top:1px solid var(--side-hl)}
  .userbox .who{display:none}
}
h1{margin:0;font-size:28px;line-height:1.2;font-weight:700;text-wrap:balance}
h2{margin:0;font-size:18px;text-wrap:balance}
h3{margin:0;font-size:15px}
.sub{color:var(--mute);margin-top:4px}
.back{color:var(--mute);font-size:14px;background:none;border:0;padding:0;font:inherit;font-size:14px;cursor:pointer;text-align:left}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.card.warn h2{color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.row>*{flex:1 1 min(100%,380px);min-width:0}
.row.top{align-items:flex-start}
.stats{display:flex;flex-wrap:wrap;gap:16px}
.stats>div{flex:1 1 min(100%,240px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stats .k{font-size:13px;color:var(--mute)}
.stats .v{font-size:32px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.stats .n{font-size:13px;color:var(--mute)}
.stats .w{background:var(--warn-bg);border-color:var(--warn-line)}
.stats .w .k,.stats .w .v,.stats .w .n{color:var(--warn)}
.stats .w .k{font-weight:600}
.pms{display:flex;flex-wrap:wrap;gap:24px}
.pms>div{flex:1 1 min(100%,240px);display:flex;flex-direction:column;gap:8px;min-width:0}
.pms .k{font-size:13px;color:var(--mute)}
.pms .v{font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.pms .n{font-size:13px;color:var(--mute)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--pri)}
.meter.soft i{background:var(--pri-soft)}
.btn{display:inline-block;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);font:inherit;font-weight:600;padding:12px 20px;border-radius:10px;cursor:pointer;text-decoration:none;min-height:44px}
.btn.ghost{background:transparent;color:var(--pri)}
.btn.plain{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.small{padding:8px 14px;min-height:40px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item>div:first-child{min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .m{font-size:13px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:16px;height:190px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bars em{font-style:normal;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.bars i{display:block;width:100%;background:var(--pri-soft);border-radius:6px 6px 0 0}
.bars span{font-size:13px}
.bars .cur i{background:var(--pri)}
.bars .cur em{color:var(--ink);font-weight:600}
.bars .cur span{font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;min-width:560px;border-collapse:collapse;text-align:left}
th{font-size:13px;font-weight:500;color:var(--mute);padding:10px 12px 10px 0}
td{padding:14px 12px 14px 0;border-top:1px solid var(--line);vertical-align:top}
tr.bad td{background:var(--warn-bg)}
tr.sum td{font-weight:700}
.ok{color:var(--pri);font-weight:600}
.no{color:var(--warn);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:8px 14px;border-radius:20px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
.var{padding:4px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--mute)}
label{font-size:14px;font-weight:600}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:46px}
textarea{resize:vertical;line-height:1.5}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--pri)}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.fr{display:flex;flex-wrap:wrap;gap:16px}
.fr>.f{flex:1 1 min(100%,200px);min-width:0}
.fr.four>.f{flex-basis:150px}
.fr.goal>.f{flex:0 1 170px}
.chk,.opt{display:flex;gap:10px;align-items:flex-start}
.chk label,.opt label{font-weight:400;line-height:1.5}
.opt small{display:block;color:var(--mute);font-size:14px}
.mail{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:20px;font-size:14px;display:flex;flex-direction:column;gap:10px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.mail .h{color:var(--mute)}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}
.acts.left{justify-content:flex-start}
.facts{color:var(--mute);font-size:14px;line-height:1.7}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Relatório mensal: impressão / salvar PDF */
@media print{
  @page{margin:14mm}
  :root:root:root{--bg:#fff;--card:#fff;--ink:#000;--mute:#333;--line:#bbb;--pri:#0F5C4D;--pri-soft:#7fb3a6;--warn:#6b4306;--warn-bg:#fff;--warn-line:#bbb;color-scheme:light}
  body{background:#fff;color:#000;font-size:12px}
  body::before,aside.side,.toast,.noprint{display:none!important}
  html,body{overflow:visible}
  .app{display:block;min-height:0}
  main{padding:0;gap:14px}
  .card,.stats>div{break-inside:avoid;border-color:#bbb}
  .scroll{overflow:visible}
  table{min-width:0;font-size:12px}
  tr{break-inside:avoid}
  h1{font-size:22px}
  .meter{border:1px solid #bbb}
  .meter i{background:#555!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

</div>

function splitLine(l,d){
 var r=[],cur="",q=false,i,ch;
 for(i=0;i<l.length;i++){
  ch=l.charAt(i);
  if(q){if(ch==='"'){if(l.charAt(i+1)==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
  else if(ch==='"')q=true;
  else if(ch===d){r.push(cur.trim());cur="";}
  else cur+=ch;
 }
 r.push(cur.trim());return r;
}
function parseTable(text){
 var lines=text.replace(/\r/g,"").split("\n").filter(function(l){return l.trim();});
 if(!lines.length)return [];
 var best="\t",bn=-1;
 ["\t",";",","].forEach(function(d){var n=lines[0].split(d).length-1;if(n>bn){bn=n;best=d;}});
 var rows=lines.map(function(l){return splitLine(l,best);});
 if(/^(nome|name)$/i.test(rows[0][0]))rows.shift();
 return rows;
}
function parseAmount(v){
 v=String(v||"").replace(/[^\d.,]/g,"");if(!v)return 0;
 var lc=v.lastIndexOf(","),ld=v.lastIndexOf(".");
 if(lc>-1&&ld>-1){v=lc>ld?v.replace(/\./g,"").replace(",","."):v.replace(/,/g,"");}
 else if(lc>-1){v=v.replace(",",".");}
 else if(/^\d{1,3}(\.\d{3})+$/.test(v)){v=v.replace(/\./g,"");}
 var n=parseFloat(v);return isFinite(n)&&n>0?n:0;
}
function normCur(v){
 var m={"R$":"BRL","BRL":"BRL","REAL":"BRL","REAIS":"BRL","US$":"USD","USD":"USD","$":"USD","DOLAR":"USD","DÓLAR":"USD","EUR":"EUR","€":"EUR","EURO":"EUR"};
 return m[String(v||"").toUpperCase().replace(/\s/g,"")]||"";
}
function normFreq(v){
 var m={"mensal":"monthly","monthly":"monthly","mes":"monthly","mês":"monthly","trimestral":"quarterly","quarterly":"quarterly","anual":"yearly","yearly":"yearly","annual":"yearly","pontual":"once","única":"once","unica":"once","once":"once","one-time":"once"};
 return m[String(v||"").toLowerCase().trim()]||"";
}

  r.amount=parseAmount(r.amountRaw);

 });

 var tm=thisMonth().sort(function(a,b){return a.date<b.date?-1:1;}), tc=totalsByCur();
 var mname=now.toLocaleDateString(loc(),{month:"long",year:"numeric"});
 var tiles=CURS.filter(function(c){return tc[c].rec>0||tc[c].plan>0;}).map(function(c){
  return '<div><div class="k">'+c+'</div><div class="v">'+money(tc[c].rec,c)+'</div><div class="n">'+t("planned")+": "+money(tc[c].plan,c)+"</div></div>";
 }).join("");
 var tables=CURS.map(function(c){
  var l=tm.filter(function(o){return o.cur===c;});if(!l.length)return "";
  return '<div style="display:flex;flex-direction:column;gap:8px"><h3>'+c+' · '+l.length+" "+t("rep_count")+'</h3><div class="scroll"><table><thead><tr><th>'+t("date")+"</th><th>"+t("who")+"</th><th>"+t("way")+"</th><th>"+t("value")+"</th></tr></thead><tbody>"+
  l.map(function(o){return "<tr><td>"+dlabel(o.date)+"</td><td>"+esc(sup(o.sid).name)+"</td><td>"+t("m_"+o.method)+"</td><td>"+money(o.amount,c)+"</td></tr>";}).join("")+
  '<tr class="sum"><td colspan="3">'+t("rep_sub_t")+" "+c+"</td><td>"+money(tc[c].rec,c)+"</td></tr></tbody></table></div></div>";
 }).join("");
 var got={};tm.forEach(function(o){(got[o.sid]=got[o.sid]||[]).push(money(o.amount,o.cur));});
 var list=S.map(function(s){
  var st=got[s.id]?'<span class="ok">'+t("rep_recv")+" · "+esc(got[s.id].join(", "))+"</span>":s.freq==="monthly"?'<span class="no">'+t("rep_miss")+"</span>":t("rep_na");
  return "<tr><td style=\"font-weight:600\">"+esc(s.name)+"</td><td>"+commitTxt(s)+"</td><td>"+(s.since?esc(new Date(+s.since.slice(0,4),+s.since.slice(5,7)-1,1).toLocaleDateString(loc(),{month:"short",year:"numeric"})):t("rep_na"))+"</td><td>"+st+"</td></tr>";
 }).join("");
 return '<header class="head"><div><h1>'+t("rep_t")+'</h1><div class="sub">'+t("rep_sub")+esc(mname)+'</div><div class="note">'+t("rep_by")+"Rafael Duarte · "+t("rep_gen")+esc(now.toLocaleDateString(loc(),{day:"numeric",month:"long",year:"numeric"}))+'</div></div><button type="button" class="btn noprint" data-a="print">'+t("rep_print")+"</button></header>"+
 '<section style="display:flex;flex-direction:column;gap:12px"><h2>'+t("rep_total")+'</h2><div class="stats">'+tiles+'</div><div class="note">'+t("rep_note")+"</div></section>"+
 '<section class="card"><h2>'+t("rep_gifts")+"</h2>"+(tables||'<div class="note">'+t("rep_none")+"</div>")+"</section>"+
 '<section class="card"><h2>'+t("rep_list")+'</h2><div class="scroll"><table><thead><tr><th>'+t("name")+"</th><th>"+t("commit")+"</th><th>"+t("since_c")+"</th><th>"+t("rep_status")+"</th></tr></thead><tbody>"+list+"</tbody></table></div></section>";
}

function dowName(i){return new Date(2024,0,7+i).toLocaleDateString(loc(),{weekday:"long"});}
function wkMail(){
 var logged={};thisMonth().forEach(function(o){logged[o.sid]=1;});
 var exp=S.filter(function(s){return s.freq==="monthly"&&!logged[s.id];}).length;
 var txt=t("wk")(exp,pendingList().length,careItems().length);
 return '<span class="h">'+t("from")+": "+esc(t("weekly_from"))+"\n"+t("to")+": rafael@exemplo.com\n"+t("subject")+": "+esc(t("weekly_subj"))+"</span>"+esc(txt);
}
function wkState(){return wk.on?t("weekly_on").replace("{d}",dowName(wk.day)):t("weekly_off");}
function viewSet(){
 return '<header><h1>'+t("set")+"</h1></header>"+
 '<section class="card"><h2>'+t("prof")+'</h2><div class="fr"><div class="f"><label for="pn">'+t("name")+'</label><input id="pn" value="Rafael Duarte"></div><div class="f"><label for="pe">'+t("sendmail")+'</label><input id="pe" type="email" value="rafael@exemplo.com"></div>'+
 '<div class="f"><label for="pi">'+t("lang_l")+'</label><select id="pi"><option value="pt"'+(lang==="pt"?" selected":"")+'>Português</option><option value="en"'+(lang==="en"?" selected":"")+">English</option></select></div></div></section>"+
 '<section class="card"><h2>'+t("weekly_t")+'</h2><div class="chk" style="align-items:center"><input id="wk-on" type="checkbox"'+(wk.on?" checked":"")+'><label for="wk-on">'+t("weekly_chk")+'</label></div>'+
 '<div class="fr goal"><div class="f"><label for="wk-day">'+t("weekly_day")+'</label><select id="wk-day">'+opts([0,1,2,3,4,5,6].map(function(i){return [i,dowName(i)];}),wk.day)+"</select></div></div>"+
 '<div class="note" id="wk-state">'+esc(wkState())+'</div><h3>'+t("weekly_prev")+'</h3><div class="mail">'+wkMail()+"</div></section>"+
 '<section class="card"><h2>'+t("thx_set")+'</h2><fieldset style="border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:24px"><legend style="padding:0;margin-bottom:10px;font-size:14px;font-weight:600">'+t("defmode")+"</legend>"+
 '<div class="chk" style="align-items:center"><input id="d-auto" name="mode" type="radio" value="auto"'+(mode==="auto"?" checked":"")+'><label for="d-auto">'+t("auto")+"</label></div>"+
 '<div class="chk" style="align-items:center"><input id="d-sug" name="mode" type="radio" value="sug"'+(mode==="sug"?" checked":"")+'><label for="d-sug">'+t("defsug")+"</label></div></fieldset>"+
 '<div class="f"><label for="sig">'+t("sign")+'</label><textarea id="sig" rows="2">'+esc(sigText())+"</textarea></div></section>"+
 '<section class="card"><h2>'+t("priv")+'</h2><div style="color:var(--mute);line-height:1.6">'+t("priv_p")+'</div><div class="acts left"><button type="button" class="btn plain" disabled title="'+esc(t("nopro"))+'">'+t("export")+'</button><button type="button" class="btn plain" disabled title="'+esc(t("nopro"))+'">'+t("consent_txt")+"</button></div></section>"+
 '<section class="card"><h2>'+t("plan")+'</h2><div style="color:var(--mute)">'+t("plan_p")+'</div></section>'+
 '<div class="acts left"><button type="button" class="btn ghost small" data-a="reset">'+t("reset")+"</button></div>";
}
function render(){
 renderChrome();
 var v=document.getElementById("view");
 var views={home:viewHome,sup:viewSup,off:viewOff,thx:viewThx,imp:viewImp,rep:viewRep,set:viewSet,newSup:viewNewSup,newOff:viewNewOff,care:viewCare};
 v.innerHTML=views[tab]();
}
function go(name){menuOpen=false;if(name!=="newSup"&&name!=="newOff"&&name!=="care")backTab=name;tab=name;render();window.scrollTo(0,0);}
function toast(m){
 var el=document.getElementById("toast");el.textContent=m;el.hidden=false;
 clearTimeout(toast.tm);toast.tm=setTimeout(function(){el.hidden=true;},3200);
}
function num(v){var n=parseFloat(String(v).replace(",","."));return isFinite(n)&&n>0?n:0;}
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-a]");if(!b)return;
 var a=b.getAttribute("data-a"), v=b.getAttribute("data-v");
 if(a==="tab"){go(v);}
 else if(a==="burger"){menuOpen=!menuOpen;renderChrome();}
 else if(a==="lang"){lang=v;render();}
 else if(a==="reset"){seed();filter="";go("home");toast(t("reset_ok"));}
 else if(a==="newSup"){go("newSup");}
 else if(a==="newOff"){offSid=v?+v:null;go("newOff");}
 else if(a==="review"){sel=+v;go("thx");}
 else if(a==="care"){careSel=v;go("care");}
 else if(a==="cdone"){done[v]=true;toast(t("care_done_ok"));go("home");}
 else if(a==="copy"){
  var ta=document.getElementById("msg");
  var fail=function(){ta.focus();ta.select();toast(t("copyfail"));};
  try{navigator.clipboard.writeText(ta.value).then(function(){toast(t("copied"));},fail);}catch(err){fail();}
 }
 else if(a==="mark"){
  O.forEach(function(o){if(o.id===sel)o.thanked=true;});
  toast(t("sentdemo"));render();
 }
 else if(a==="impEx"){impText=SAMPLE;document.getElementById("imp-text").value=impText;impUpdate();}
 else if(a==="impClear"){impText="";document.getElementById("imp-text").value="";impUpdate();}
 else if(a==="import"){
  var rows=impRows(), ok=rows.filter(function(r){return !r.errs.length;});
  if(!ok.length||!impConsent)return;
  ok.forEach(function(r){S.push({id:++uid,name:r.name,email:r.email,wa:r.wa,amount:r.amount,cur:r.cur,freq:r.freq,method:"pix",consent:true});});
  var skipped=rows.length-ok.length;
  impText="";impConsent=false;filter="";go("sup");toast(t("imp_done").replace("{n}",ok.length).replace("{m}",skipped));
 }
 else if(a==="print"){window.print();}
});
document.addEventListener("keydown",function(e){
 if(e.key==="Escape"&&menuOpen){menuOpen=false;renderChrome();document.getElementById("burger").focus();}
});
document.addEventListener("click",function(e){
 if(menuOpen&&!e.target.closest("aside.side")){menuOpen=false;renderChrome();}
});
document.addEventListener("input",function(e){
 var el=e.target;
 if(el.id==="q"){filter=el.value;document.getElementById("rows").innerHTML=supRows();}
 else if(el.id==="msg"){
  var s=sup(+el.getAttribute("data-sid")), subj=el.getAttribute("data-subj");
  drafts[el.getAttribute("data-key")]=el.value;
  document.getElementById("mail").innerHTML=mailHtml(s,el.value,subj);
  var w=document.getElementById("b-wa"), m=document.getElementById("b-mail");
  if(w)w.setAttribute("href",waHref(s,el.value));
  if(m)m.setAttribute("href",mailHref(s,el.value,subj));
 }
 else if(el.id==="sig"){sigCustom=el.value;drafts={};}
 else if(el.id==="imp-text"){impText=el.value;impUpdate();}
});
document.addEventListener("change",function(e){
 var el=e.target;
 if(el.name==="mode"){mode=el.value;}
 else if(el.id==="pi"){lang=el.value;render();}
 else if(el.id==="imp-con"){impConsent=el.checked;impBtnState();}
 else if(el.id==="goal-amt"||el.id==="goal-cur"){
  goal.amt=num(document.getElementById("goal-amt").value);goal.cur=document.getElementById("goal-cur").value;render();
 }
 else if(el.id==="wk-on"||el.id==="wk-day"){
  wk.on=document.getElementById("wk-on").checked;wk.day=+document.getElementById("wk-day").value;
  document.getElementById("wk-state").textContent=wkState();
 }
 else if(el.id==="o-sup"){
  var s=sup(+el.value);
  document.getElementById("o-amt").value=s.amount;document.getElementById("o-cur").value=s.cur;document.getElementById("o-met").value=s.method;
  document.getElementById("osum").innerHTML=offSummary(s.id);
 }
});
document.addEventListener("submit",function(e){
 e.preventDefault();
 var id=e.target.id;
 if(id==="f-sup"){
  var n=document.getElementById("s-name").value.trim(), em=document.getElementById("s-email").value.trim();
  if(!n||!em)return;
  S.push({id:++uid,name:n,email:em,wa:document.getElementById("s-wa").value.trim(),bday:document.getElementById("s-bday").value||"",since:document.getElementById("s-since").value||"",amount:num(document.getElementById("s-amt").value),cur:document.getElementById("s-cur").value,freq:document.getElementById("s-freq").value,method:document.getElementById("s-met").value,consent:document.getElementById("s-con").checked});
  filter="";go("sup");toast(t("saved_sup"));
 } else if(id==="f-off"){
  var amt=num(document.getElementById("o-amt").value);if(!amt)return;
  var sid=+document.getElementById("o-sup").value, prep=document.getElementById("o-prep").checked;
  O.push({id:++uid,sid:sid,date:document.getElementById("o-date").value||iso(now),amount:amt,cur:document.getElementById("o-cur").value,method:document.getElementById("o-met").value,thanked:false});
  if(prep){sel=uid;go("thx");}else{go(backTab==="thx"?"thx":"off");}
  toast(t("saved_off"));
 }
});
try{if(navigator.language&&navigator.language.toLowerCase().indexOf("pt")!==0)lang="en";}catch(e){}
seed();render();
})();
</script>
</body>
</html>
